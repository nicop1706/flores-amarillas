<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ======================================================
     VARIABLES DE COLOR
     ====================================================== */
  :root{
    --bg-deep:      #1b140d;   /* fondo base, marrón muy oscuro y cálido */
    --bg-deep-2:    #2a1d10;   /* segundo tono del degradado de fondo */
    --petal-gold:   #f5c542;   /* amarillo pétalo principal */
    --petal-light:  #ffe9a8;   /* amarillo claro, brillos y resaltes */
    --petal-amber:  #d99a2b;   /* sombra cálida de los pétalos */
    --stem-green:   #4c6b3a;   /* verde tallo, apagado y elegante */
    --cream-text:   #fbf3e1;   /* texto principal claro */
    --glass-bg:     rgba(30, 22, 12, 0.35);
    --glass-border: rgba(255, 233, 168, 0.35);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background: var(--bg-deep);
    overflow:hidden;
    font-family:'Cormorant Garamond', serif;
  }

  body{
    width:100%;
    height:100vh;
    height:100dvh;
    position:relative;
    color: var(--cream-text);
  }

  /* ---------- FONDO CÁLIDO CON DEGRADADO SUTIL ---------- */
  #backdrop{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(245,197,66,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 55%, #150f09 100%);
    z-index:0;
  }

  /* ================= PANTALLA DE INICIO ================= */
  #welcome{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.4rem;
    text-align:center;
    padding:1.5rem;
    transition: opacity 1.1s ease, visibility 1.1s ease;
    width: 100vw;
    height: 100vh;
  }

  #welcome.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  #welcomeBg{
    position:absolute;
    top: 0; left: 0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.9;
    z-index:0;
  }

  #welcome::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(0, 0, 0, 0.4); 
    z-index:0;
  }

  #welcome > *{ position:relative; z-index:2; }

  #welcome h1{
    font-weight:500;
    font-size:clamp(2rem, 6vw, 3.6rem);
    letter-spacing:0.01em;
    color: var(--cream-text);
    text-shadow: 0 0 15px rgba(0,0,0,0.8);
    animation: riseIn 1.4s ease both;
  }

  @keyframes riseIn{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  #openBtn{
    font-family:'Cormorant Garamond', serif;
    font-size:1.15rem;
    letter-spacing:0.06em;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--petal-light), var(--petal-gold));
    border:none;
    padding:0.85rem 2.6rem;
    border-radius:999px;
    cursor:pointer;
    position:relative;
    animation: riseIn 1.4s ease 0.3s both, pulseGlow 2.6s ease-in-out infinite;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }

  #openBtn:hover{
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 0 32px rgba(245,197,66,0.55);
  }

  @keyframes pulseGlow{
    0%, 100%{ box-shadow: 0 0 14px rgba(245,197,66,0.35); }
    50%{      box-shadow: 0 0 30px rgba(245,197,66,0.65); }
  }

  /* ================= ESCENA DE FLORES ================= */
  #flowerScene{
    position:fixed;
    inset:0;
    z-index:1;
    opacity:0;
    transition: opacity 1.4s ease;
  }

  #flowerScene.show{ opacity:1; }

  #flowerCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  /* ================= TARJETA DE DEDICATORIA ================= */
  #dedication{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    opacity:0;
    transform: translateY(14px);
    pointer-events:none;
    transition: opacity 1.3s ease, transform 1.3s ease;
  }

  #dedication.show{
    opacity:1;
    transform: translateY(0);
    pointer-events:auto;
  }

  .glass-card{
    max-width: 520px;
    width:100%;
    padding: 2.6rem 2.2rem;
    border-radius: 22px;
    text-align:center;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  }

  .glass-card p{
    font-family:'Dancing Script', cursive;
    font-weight:600;
    font-size: clamp(1.5rem, 4.4vw, 2.3rem);
    line-height:1.5;
    color: var(--petal-light);
    text-shadow: 0 2px 18px rgba(0,0,0,0.4);
  }

  .glass-card .signature{
    margin-top:1.2rem;
    font-family:'Cormorant Garamond', serif;
    font-size:1rem;
    letter-spacing:0.08em;
    color: rgba(251,243,225,0.65);
  }

  /* Se le añade cursor para que sepa que se puede clickear */
  .polaroid{
    width: 190px;
    margin: 0 auto 1.6rem auto;
    background: #fbf3e1;
    padding: 0.7rem 0.7rem 1.1rem 0.7rem;
    border-radius: 3px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.45);
    transform: rotate(-4deg);
    transition: transform 0.4s ease;
    cursor: pointer; /* <--- Efecto de mano al pasar el mouse */
  }

  .polaroid:hover{ transform: rotate(-1deg) scale(1.03); }

  .polaroid-frame{
    width:100%;
    aspect-ratio: 1 / 1;
    background:
      repeating-linear-gradient(45deg, rgba(76,107,58,0.15) 0 8px, rgba(217,154,43,0.1) 8px 16px);
    border:1px dashed rgba(76,107,58,0.55);
    border-radius:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .polaroid-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .polaroid-frame img:not([src]), .polaroid-frame img[src=""]{
    display:none;
  }

  .polaroid-hint{
    font-family:'Cormorant Garamond', serif;
    font-size:0.72rem;
    letter-spacing:0.03em;
    color: rgba(27,20,13,0.55);
    text-align:center;
    padding: 0 0.3rem;
  }

  .polaroid-note{
    margin-top:0.55rem;
    font-family:'Dancing Script', cursive;
    font-size:1.05rem;
    color:#3a2c14;
    text-align:center;
  }

  /* ================= VISOR DE IMAGEN GRANDE (LIGHTBOX) ================= */
  #lightbox{
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
    cursor: zoom-out;
  }

  #lightbox.show{
    opacity: 1;
    visibility: visible;
  }

  #lightbox img{
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    transform: scale(0.9);
    transition: transform 0.4s ease;
  }

  #lightbox.show img{
    transform: scale(1);
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<div id="backdrop"></div>

<!-- ================= PANTALLA DE INICIO ================= -->
<section id="welcome">
  <img id="welcomeBg" src="" alt="">
  <h1>Hola, esto es para ti</h1>
  <button id="openBtn" type="button">Descubrir</button>
</section>

<!-- ================= ESCENA DE FLORES (canvas) ================= -->
<div id="flowerScene">
  <canvas id="flowerCanvas"></canvas>
</div>

<!-- ================= DEDICATORIA ================= -->
<div id="dedication">
  <div class="glass-card">
    
    <!-- Aquí está tu polaroid -->
    <div class="polaroid" id="polaroidBtn" title="Toca para ver en grande">
      <div class="polaroid-frame">
        <img id="flowerArt" src="imagenes/nic1.jpg" alt="Dibujo de flores amarillas">
        <span class="polaroid-hint">tu dibujo<br>de flores<br>amarillas aquí</span>
      </div>
      <div class="polaroid-note">hecho con cariño 🌻</div>
    </div>
    
    <p>Un pequeño detalle para alegrar tu día.<br>¡Feliz 21 de septiembre!</p>
    <div class="signature">te quiero muxhoo nico</div>
  </div>
</div>

<!-- ================= LIGHTBOX (OCULTO POR DEFECTO) ================= -->
<div id="lightbox">
  <img id="lightboxImg" src="" alt="Imagen ampliada">
</div>

<script>
(function(){
  "use strict";

  const welcome   = document.getElementById('welcome');
  const openBtn   = document.getElementById('openBtn');
  const scene     = document.getElementById('flowerScene');
  const dedication= document.getElementById('dedication');
  const canvas    = document.getElementById('flowerCanvas');
  const ctx       = canvas.getContext('2d');

  /* Referencias para el visor de imagen */
  const polaroidBtn = document.getElementById('polaroidBtn');
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const flowerArt   = document.getElementById('flowerArt');

  /* Eventos del Lightbox */
  polaroidBtn.addEventListener('click', () => {
    // Solo abre si la imagen tiene un src válido
    if(flowerArt.getAttribute('src')) {
      lightboxImg.src = flowerArt.src;
      lightbox.classList.add('show');
    }
  });

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('show');
  });

  document.querySelectorAll('#welcomeBg, #flowerArt').forEach(img => {
    const toggle = () => {
      const hasImg = !!img.getAttribute('src');
      img.style.display = hasImg ? 'block' : 'none';
      const hint = img.parentElement && img.parentElement.querySelector('.polaroid-hint');
      if(hint) hint.style.display = hasImg ? 'none' : 'block';
    };
    img.addEventListener('load', toggle);
    img.addEventListener('error', toggle);
    toggle();
  });

  let width, height, dpr;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width  = window.innerWidth;
    height = window.innerHeight;
    canvas.width  = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width  = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function makeFlower(xRatio, delay){
    return {
      x: xRatio,
      baseY: 1,
      stemLen: rand(0.16, 0.30),
      growth: 0,
      bloom: 0,
      delay: delay,
      sway: rand(0, Math.PI * 2),
      swaySpeed: rand(0.4, 0.8),
      petalCount: Math.round(rand(8, 12)),
      petalColorMix: rand(0, 1),
      size: rand(0.85, 1.25),
      centerR: rand(9, 13)
    };
  }

  const flowers = [];
  const flowerXs = [0.08, 0.2, 0.33, 0.47, 0.6, 0.72, 0.85, 0.95, 0.14, 0.58, 0.4, 0.78];
  flowerXs.forEach((x, i) => flowers.push(makeFlower(x, i * 0.22)));

  function makePetal(depth){
    return {
      x: rand(0, 1),
      y: rand(-0.3, 1),
      depth,
      size: rand(6, 14) * (0.6 + depth * 0.8),
      rot: rand(0, Math.PI * 2),
      rotSpeed: rand(-0.6, 0.6),
      fallSpeed: rand(0.02, 0.05) * (0.5 + depth),
      swayPhase: rand(0, Math.PI * 2),
      swayAmp: rand(0.01, 0.03)
    };
  }
  const fallingPetals = [];
  for(let i=0;i<16;i++) fallingPetals.push(makePetal(rand(0,1)));

  function drawPetalShape(size, hue){
    ctx.beginPath();
    ctx.ellipse(0, 0, size*0.55, size*0.3, 0, 0, Math.PI*2);
    ctx.fillStyle = hue;
    ctx.fill();
  }

  function drawFallingPetals(dt){
    ctx.save();
    fallingPetals.forEach(p => {
      p.y += p.fallSpeed * dt;
      p.rot += p.rotSpeed * dt;
      p.swayPhase += dt;
      if(p.y > 1.15){
        p.y = rand(-0.3, -0.05);
        p.x = rand(0,1);
      }
      const px = (p.x + Math.sin(p.swayPhase) * p.swayAmp) * width;
      const py = p.y * height;
      const alpha = 0.35 + p.depth * 0.45;
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);
      ctx.rotate(p.rot);
      const grad = ctx.createLinearGradient(-p.size/2,0,p.size/2,0);
      grad.addColorStop(0, 'rgba(217,154,43,0.9)');
      grad.addColorStop(1, 'rgba(255,233,168,0.95)');
      drawPetalShape(p.size, grad);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawStem(fx, groundY, topY, sway){
    ctx.save();
    ctx.strokeStyle = 'rgba(76,107,58,0.85)';
    ctx.lineWidth = 3.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fx, groundY);
    const midY = groundY - (groundY - topY) * 0.55;
    const swayOffset = Math.sin(sway) * 10;
    ctx.quadraticCurveTo(fx + swayOffset, midY, fx + swayOffset*1.4, topY);
    ctx.stroke();

    const leafY = groundY - (groundY - topY) * 0.4;
    ctx.beginPath();
    ctx.ellipse(fx + swayOffset*0.7 - 10, leafY, 12, 5, -0.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(76,107,58,0.7)';
    ctx.fill();
    ctx.restore();
    return fx + swayOffset*1.4;
  }

  function drawBloom(cx, cy, bloomProgress, f){
    if(bloomProgress <= 0) return;
    ctx.save();
    ctx.translate(cx, cy);
    const scale = f.size * (0.3 + 0.7 * bloomProgress);
    ctx.scale(scale, scale);

    const petalLen = 22;
    const petalW = 9;
    for(let i=0;i<f.petalCount;i++){
      const angle = (i / f.petalCount) * Math.PI * 2;
      ctx.save();
      ctx.rotate(angle);
      ctx.translate(0, -petalLen*0.55*bloomProgress);
      const g = ctx.createLinearGradient(0,-petalLen/2,0,petalLen/2);
      g.addColorStop(0, '#ffe9a8');
      g.addColorStop(1, f.petalColorMix > 0.5 ? '#f5c542' : '#d99a2b');
      ctx.beginPath();
      ctx.ellipse(0, 0, petalW*bloomProgress, petalLen*0.5*bloomProgress, 0, 0, Math.PI*2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }

    const centerGrad = ctx.createRadialGradient(0,0,0,0,0,f.centerR);
    centerGrad.addColorStop(0, '#7a5a1e');
    centerGrad.addColorStop(1, '#54390f');
    ctx.beginPath();
    ctx.arc(0,0, f.centerR*bloomProgress, 0, Math.PI*2);
    ctx.fillStyle = centerGrad;
    ctx.fill();

    ctx.restore();
  }

  let lastTime = performance.now();
  let sceneStart = null;
  let animRunning = false;

  function frame(now){
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    ctx.clearRect(0,0,width,height);

    if(sceneStart === null) sceneStart = now;
    const t = (now - sceneStart) / 1000;

    drawFallingPetals(dt);

    const groundY = height * 1.02;

    flowers.forEach(f => {
      const localT = t - f.delay;
      if(localT <= 0) return;

      f.growth = Math.min(1, localT / 1.6);
      const easedGrowth = 1 - Math.pow(1 - f.growth, 3);
      const topY = groundY - easedGrowth * f.stemLen * height;

      if(f.growth >= 1){
        f.bloom = Math.min(1, (localT - 1.6) / 1.1);
      }
      const easedBloom = 1 - Math.pow(1 - f.bloom, 3);

      f.sway += dt * f.swaySpeed;
      const fx = f.x * width;

      const tipX = drawStem(fx, groundY, topY, f.sway);
      drawBloom(tipX, topY, easedBloom, f);
    });

    if(animRunning) requestAnimationFrame(frame);
  }

  function startFlowerScene(){
    scene.classList.add('show');
    animRunning = true;
    lastTime = performance.now();
    sceneStart = null;
    requestAnimationFrame(frame);

    setTimeout(() => {
      dedication.classList.add('show');
    }, reduceMotion ? 400 : 2200);
  }

  openBtn.addEventListener('click', () => {
    welcome.classList.add('hide');
    setTimeout(startFlowerScene, reduceMotion ? 0 : 700);
  });

})();
</script>
</body>
</html>
